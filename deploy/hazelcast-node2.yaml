# Hazelcast 5.4.0 member 2 of 3 (scripts/hz.sh starts it).
# All members run on this machine: TCP-IP discovery over 127.0.0.1:5701-5703,
# each pinned to its own port, and a CP Subsystem on all three members.
hazelcast:
  cluster-name: dev
  instance-name: hz-node2
  properties:
    hazelcast.phone.home.enabled: false
    hazelcast.socket.bind.any: false
  network:
    port:
      port: 5702
      auto-increment: false
    interfaces:
      enabled: true
      interfaces:
        - 127.0.0.1
    join:
      auto-detection:
        enabled: false
      multicast:
        enabled: false
      tcp-ip:
        enabled: true
        member-list:
          - 127.0.0.1:5701
          - 127.0.0.1:5702
          - 127.0.0.1:5703
  cp-subsystem:
    cp-member-count: 3
    group-size: 3

  # Task Adv 1: the maps likes_write_through and likes_write_behind cache the
  # PostgreSQL table user_likes (user_id bigint PRIMARY KEY, likes bigint).
  # The generic MapLoader/MapStore (hazelcast-mapstore) reaches the table
  # over the JDBC data connection below and the SQL engine, which needs Jet;
  # the PostgreSQL JDBC driver comes from CLASSPATH (scripts/hz.sh). No
  # MapStore code of our own: only this configuration.
  jet:
    enabled: true
  data-connection:
    likes-db:
      type: JDBC
      shared: true
      properties:
        jdbcUrl: jdbc:postgresql://127.0.0.1:21410/postgres
        user: postgres
  map:
    # Write-through: a change is in the table before the member answers.
    likes_write_through:
      map-store:
        enabled: true
        class-name: com.hazelcast.mapstore.GenericMapStore
        write-delay-seconds: 0
        properties:
          data-connection-ref: likes-db
          external-name: user_likes
          id-column: user_id
          columns: likes
          # The value is the likes column itself (a Long), not a GenericRecord.
          single-column-as-value: "true"
          # Read-through only: no loading of every row when the map starts.
          load-all-keys: "false"
    # Write-behind: changes are queued and stored 5 s later, the latest value
    # of each key only (write-coalescing).
    likes_write_behind:
      map-store:
        enabled: true
        class-name: com.hazelcast.mapstore.GenericMapStore
        write-delay-seconds: 5
        write-coalescing: true
        properties:
          data-connection-ref: likes-db
          external-name: user_likes
          id-column: user_id
          columns: likes
          single-column-as-value: "true"
          load-all-keys: "false"
