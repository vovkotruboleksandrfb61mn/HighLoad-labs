# Logging for the members started by scripts/hz.sh: plain text to standard
# output only (hz.sh sends it to reports/logs/hz-node{1,2,3}.log). The stock
# config also writes $HAZELCAST_HOME/logs/hazelcast.log, which the three
# members would share.
appender.console.type=Console
appender.console.name=STDOUT
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d [%5p] [%t] [%c{1.}]: %m%n%xEx

rootLogger.level=${env:LOGGING_LEVEL:-INFO}
rootLogger.appenderRef.stdout.ref=STDOUT
